services:
  - type: web
    name: estimator-backend
    runtime: node
    plan: free
    # npm install with NODE_ENV=production omits devDependencies, which drops
    # tsc and fails the build. --include=dev keeps it; ci honours the lockfile.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    autoDeploy: true
    # Every push to master rebuilds and swaps the instance, and a swap wipes
    # every in-memory session (see sessionStore.ts) — a docs-only commit
    # shouldn't be able to end a Session in progress. Intent only, like the rest
    # of this file: the live service is manual, so this does nothing until it's
    # set in the dashboard (R10).
    buildFilter:
      ignoredPaths:
        # Both patterns on purpose: every markdown file that has actually
        # triggered a deploy here (README, PLAN, DEPLOYMENT, CLAUDE,
        # estimator-plan) sits at the repo root, and a leading `**/` is not
        # reliably zero-directory. `*.md` covers the root, `**/*.md` the rest.
        - '*.md'
        - '**/*.md'
    envVars:
      - key: NODE_ENV
        value: production
      # Comma-separated list of the Vercel production origins this backend
      # serves (https, no trailing slash), typed into the dashboard. Not in the
      # repo: it changes with the frontends' domains.
      - key: CORS_ORIGIN
        sync: false
